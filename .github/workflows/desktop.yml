# Збирає Skybee: Windows (інсталятор NSIS), Linux (AppImage, tar.gz) і Flatpak.
# - тег vX.Y.Z  → реліз на GitHub з інсталятором і latest.yml (з нього встановлений Skybee оновлюється сам)
# - ручний запуск або зміни застосунку → інсталятор в артефактах запуску (ZIP) і готові файли без архіву
#   в тестовому (pre-release) релізі «desktop-test»: Skybee-Setup.exe, Skybee.AppImage, Skybee-linux-x64.tar.gz, Skybee.flatpak
name: Desktop (Windows)
# (назву лишено, щоб не губилася історія запусків; тепер тут і Linux, і Flatpak)

on:
  push:
    tags: ["v*"]
    branches: ["main"] # лише main: інакше кожна зміна збиралася двічі (гілка + злиття) і гілка перезаписувала тестові релізи
    paths: ["desktop/**", "flatpak/**", "scripts/dist.mjs", ".github/workflows/desktop.yml", "index.html", "css/**", "js/**", "icons/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Випустити реліз із цим тегом (наприклад v0.2.0); порожньо — лише артефакти"
        required: false
        default: ""

permissions:
  contents: write

env:
  # тег релізу: з пушу тегу або з ручного запуску
  RELEASE_TAG: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Номер бета-версії
        # тестові збірки — бета-канал застосунку: наступний патч + номер запуску (0.3.0 → 0.3.1-beta.57), тож бета завжди
        # новіша за останній реліз, а наступний реліз (0.3.1) — новіший за бету
        if: env.RELEASE_TAG == ''
        shell: bash
        run: |
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8')),[a,b,c]=p.version.split('-')[0].split('.').map(Number);p.version=a+'.'+b+'.'+(c+1)+'-beta.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log(p.version)"
      - name: Збірка
        run: npm run dist
      - name: Пробний запуск
        shell: pwsh
        run: |
          $p = Start-Process dist/win-unpacked/Skybee.exe -PassThru
          Start-Sleep 20
          if ($p.HasExited) {
            "Skybee закрився сам, код $($p.ExitCode)"
            Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue | Format-List TimeCreated, ProviderName, Message
            exit 1
          }
          "Skybee працює"
          Get-Process Skybee -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Skybee-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
      # latest.yml і .blockmap — для самооновлення: застосунок читає latest.yml з найновішого релізу
      - name: Перевірка файлів оновлення
        shell: pwsh
        run: |
          if (-not (Test-Path dist/latest.yml)) { "Немає latest.yml — самооновлення не працюватиме"; exit 1 }
          Get-Content dist/latest.yml
      - name: Реліз
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          generate_release_notes: true
      # Тестовий реліз = бета-канал: ті самі файли без ZIP, зі сталими назвами, і latest.yml під ці назви — його читають
      # застосунки з увімкненим «Бета-тестуванням». Звичайні беруть лише справжні релізи (desktop-test — pre-release)
      - name: Файли для тестового релізу
        if: env.RELEASE_TAG == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test | Out-Null
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName test/Skybee-Setup.exe
          Copy-Item "$($exe.FullName).blockmap" test/Skybee-Setup.exe.blockmap
          (Get-Content dist/latest.yml -Raw).Replace($exe.Name, "Skybee-Setup.exe") | Set-Content test/latest.yml -NoNewline
          Get-Content test/latest.yml
          if (-not (Select-String -Path test/latest.yml -SimpleMatch "Skybee-Setup.exe" -Quiet)) { "latest.yml не вказує на Skybee-Setup.exe"; exit 1 }
          Get-ChildItem test
      - name: Тестовий реліз
        if: env.RELEASE_TAG == ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: desktop-test
          target_commitish: ${{ github.sha }}
          name: "Skybee для комп'ютера (тестова збірка)"
          prerelease: true
          make_latest: false
          body: |
            Тестові (бета) збірки — оновлюються з кожною зміною застосунку, файли без архівів.
            Windows: Skybee-Setup.exe. Linux: Skybee.AppImage (зробіть виконуваним), Skybee-linux-x64.tar.gz або Skybee.flatpak (flatpak install --user Skybee.flatpak).
            Щоб отримувати їх автоматично: Налаштування → Про Skybee → «Бета-тестування».
          files: |
            desktop/test/Skybee-Setup.exe
            desktop/test/Skybee-Setup.exe.blockmap
            desktop/test/latest.yml

  linux:
    needs: windows # реліз створює Windows-збірка; решта лише додає до нього файли
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Номер бета-версії
        # тестові збірки — бета-канал застосунку: наступний патч + номер запуску (0.3.0 → 0.3.1-beta.57), тож бета завжди
        # новіша за останній реліз, а наступний реліз (0.3.1) — новіший за бету
        if: env.RELEASE_TAG == ''
        shell: bash
        run: |
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8')),[a,b,c]=p.version.split('-')[0].split('.').map(Number);p.version=a+'.'+b+'.'+(c+1)+'-beta.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log(p.version)"
      - name: Збірка
        run: npm run dist:linux
      - name: Перевірка
        run: |
          ls -la dist
          test -f dist/latest-linux.yml || { echo "Немає latest-linux.yml — AppImage не оновлюватиметься сам"; exit 1; }
          tar -tzf dist/*.tar.gz | grep -q '/skybee$' || { echo "У tar.gz немає виконуваного skybee"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Skybee-Linux
          path: |
            desktop/dist/*.tar.gz
            desktop/dist/*.AppImage
            desktop/dist/latest-linux.yml
      - name: Реліз
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            desktop/dist/*.tar.gz
            desktop/dist/*.AppImage
            desktop/dist/latest-linux.yml
      - name: Файли для тестового релізу
        if: env.RELEASE_TAG == ''
        run: |
          mkdir -p test
          img=$(basename dist/*.AppImage)
          cp "dist/$img" test/Skybee.AppImage
          cp dist/*.tar.gz test/Skybee-linux-x64.tar.gz
          # бета-канал для AppImage: latest-linux.yml під сталу назву файлу
          sed "s/${img//./\\.}/Skybee.AppImage/g" dist/latest-linux.yml > test/latest-linux.yml
          cat test/latest-linux.yml
          grep -q "Skybee.AppImage" test/latest-linux.yml || { echo "latest-linux.yml не вказує на Skybee.AppImage"; exit 1; }
          ls -la test
      - name: Тестовий реліз
        if: env.RELEASE_TAG == ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: desktop-test
          target_commitish: ${{ github.sha }} # без нього оновлення релізу падає: «Resource not accessible by integration»
          prerelease: true
          make_latest: false
          files: |
            desktop/test/Skybee.AppImage
            desktop/test/Skybee-linux-x64.tar.gz
            desktop/test/latest-linux.yml

  # Flatpak з тієї самої Linux-збірки: пакет Skybee.flatpak для встановлення напряму
  # і маніфест для Flathub (з url і sha256 архіву в релізі)
  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039 # freedesktop-26.08 (= runtime-version у маніфесті); оновлюючи — новий digest
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Skybee-Linux
          path: flatpak/dl
      - name: Підготовка
        run: |
          cp flatpak/dl/*.tar.gz flatpak/skybee-linux-x64.tar.gz
          # Рантайми в образі лежать у нижньому шарі overlayfs: оновлюючи їх, flatpak перейменовує теки,
          # і це падає з «Invalid cross-device link». Копіюємо інсталяцію у верхній (записуваний) шар.
          for d in $(flatpak --installations); do
            [ -d "$d" ] || continue
            cp -a "$d" "$d.rw" && rm -rf "$d" && mv "$d.rw" "$d"
          done
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master, pinned (no release tags)
        with:
          bundle: Skybee.flatpak
          manifest-path: flatpak/io.github.vysocavnu.skybee.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true
      - name: Маніфест для Flathub
        shell: bash
        run: |
          name=$(basename flatpak/dl/*.tar.gz)
          sum=$(sha256sum flatpak/skybee-linux-x64.tar.gz | cut -d' ' -f1)
          url="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG:-${GITHUB_REF_NAME}}/${name}"
          sed "s|        path: skybee-linux-x64.tar.gz|        url: ${url}\n        sha256: ${sum}|" flatpak/io.github.vysocavnu.skybee.yml > io.github.vysocavnu.skybee.flathub.yml
          cat io.github.vysocavnu.skybee.flathub.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Flathub-manifest
          path: io.github.vysocavnu.skybee.flathub.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Flatpak-bundle # з нього збирається власний репозиторій Flatpak (job flatpak-repo)
          path: Skybee.flatpak
      - name: Реліз
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            Skybee.flatpak
            io.github.vysocavnu.skybee.flathub.yml
            flatpak/io.github.vysocavnu.skybee.desktop
            flatpak/io.github.vysocavnu.skybee.metainfo.xml
            flatpak/icon-512.png
      - name: Тестовий реліз
        if: env.RELEASE_TAG == ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: desktop-test
          target_commitish: ${{ github.sha }} # без нього оновлення релізу падає: «Resource not accessible by integration»
          prerelease: true
          make_latest: false
          files: Skybee.flatpak

  # Власний Flatpak-репозиторій на хостингу (https://skybee.online/flatpak/): з нього `flatpak update` оновлює Skybee без Flathub.
  # Лише на релізах і лише якщо задані секрети FLATPAK_GPG_KEY (приватний ключ підпису, armored, без пароля) і HOSTING_* — інакше пропускає.
  flatpak-repo:
    needs: flatpak
    # секрети підпису й хостингу — лише для коду з main і тегів (не з чужої гілки через workflow_dispatch)
    if: ${{ (inputs.version != '' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: cfg
        env:
          GPG: ${{ secrets.FLATPAK_GPG_KEY }}
          HOST: ${{ secrets.HOSTING_HOST }}
          LOGIN: ${{ secrets.HOSTING_USER }}
          PASS: ${{ secrets.HOSTING_PASS }}
        run: |
          if [ -n "$GPG" ] && [ -n "$HOST" ] && [ -n "$LOGIN" ] && [ -n "$PASS" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "Немає FLATPAK_GPG_KEY або HOSTING_*: власний Flatpak-репозиторій пропущено"; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.cfg.outputs.ok == '1'
        with:
          name: Flatpak-bundle
      - name: Репозиторій (OSTree), підписаний
        if: steps.cfg.outputs.ok == '1'
        env:
          GPG: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak ostree gnupg lftp >/dev/null
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent 2>/dev/null; rm -rf "$GNUPGHOME"' EXIT # приватний ключ не лишається на диску
          printf '%s\n' "$GPG" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          [ -n "$KEYID" ] || { echo "Не вдалося прочитати ключ підпису"; exit 1; }
          flatpak build-import-bundle --gpg-sign="$KEYID" --gpg-homedir="$GNUPGHOME" repo Skybee.flatpak
          flatpak build-update-repo --gpg-sign="$KEYID" --gpg-homedir="$GNUPGHOME" --title="Skybee" --prune repo
          PUB=$(gpg --export "$KEYID" | base64 -w0)
          mkdir -p out
          cat > out/skybee.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Skybee
          Url=https://skybee.online/flatpak/repo/
          Homepage=https://skybee.online/
          Comment=Skybee — відкритий клієнт для Bluesky
          Icon=https://skybee.online/icons/icon-192.png
          GPGKey=$PUB
          EOF
          cat > out/skybee.flatpakref <<EOF
          [Flatpak Ref]
          Title=Skybee
          Name=io.github.vysocavnu.skybee
          Branch=master
          Url=https://skybee.online/flatpak/repo/
          SuggestRemoteName=skybee
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=$PUB
          EOF
          sed -i 's/^          //' out/skybee.flatpakrepo out/skybee.flatpakref
          ls -la repo out
      - name: Залити на хостинг
        if: steps.cfg.outputs.ok == '1'
        env:
          HOST: ${{ secrets.HOSTING_HOST }}
          LOGIN: ${{ secrets.HOSTING_USER }}
          LFTP_PASSWORD: ${{ secrets.HOSTING_PASS }}
          DIR: ${{ vars.HOSTING_DIR }}
          PROTO: ${{ vars.HOSTING_PROTO || 'ftp' }}
          KNOWN_HOSTS: ${{ secrets.HOSTING_KNOWN_HOSTS }}
        run: |
          case "$PROTO" in ftp|sftp) ;; *) echo "HOSTING_PROTO має бути ftp або sftp"; exit 1;; esac
          [[ "$HOST$LOGIN${DIR:-.}" =~ ^[A-Za-z0-9._@/~-]+$ && "$HOST" != -* && "$LOGIN" != -* ]] || { echo "HOSTING_HOST / HOSTING_USER / HOSTING_DIR: недозволені символи"; exit 1; }
          if [ "$PROTO" = sftp ]; then
            [ -n "$KNOWN_HOSTS" ] || { echo "Для sftp потрібен секрет HOSTING_KNOWN_HOSTS (вивід ssh-keyscan сервера)"; exit 1; }
            mkdir -p ~/.ssh && printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi
          # без --delete (старі об'єкти потрібні клієнтам); summary і підпис — останніми, щоб репозиторій ніколи не був напівоновленим
          # індекси summary — лише після всіх об'єктів (клієнт читає summary.idx першим), потім підпис; шляхи абсолютні від кореня входу
          LAST=""
          for f in summary.idx summary.idx.sig summary summary.sig; do
            [ -f "repo/$f" ] && LAST="$LAST put -O \"${DIR:-.}/flatpak/repo\" repo/$f;"
          done
          lftp -c "
            set cmd:fail-exit yes; set net:max-retries 3; set net:timeout 30;
            set ftp:ssl-force true; set ftp:ssl-protect-data true;
            open --env-password -u \"$LOGIN\" $PROTO://$HOST;
            mkdir -pf \"${DIR:-.}/flatpak/repo\";
            mirror -R --verbose --parallel=4 -X 'summary*' repo \"${DIR:-.}/flatpak/repo\";
            $LAST
            put -O \"${DIR:-.}/flatpak\" out/skybee.flatpakrepo; put -O \"${DIR:-.}/flatpak\" out/skybee.flatpakref
          "
