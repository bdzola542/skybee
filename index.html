  <p><a href="bluesky-klient/">Skybee — клієнт для Bluesky українською</a> · <a href="bluesky-client/">Skybee — a free open-source Bluesky client</a></p>
  <h1>Skybee — відкритий клієнт для Bluesky</h1>
  <p>Безкоштовний клієнт соцмережі Bluesky українською: колонки поруч, власні стрічки без сервера, чати, сповіщення, теми Liquid Glass і Material, оформлення профілю.</p>
  <p>Працює у браузері, а також як застосунок для Windows, Linux, Android та iPhone — <a href="https://github.com/vysocavnu/skybee/releases">завантажити</a>.</p>
  <p>Для роботи Skybee потрібен JavaScript.</p>
